<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profiler">
<title>Profiler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand">◢ PROFILER</div>
  <form id="search" autocomplete="off">
    <div class="row">
      <input id="handle" type="text" name="handle" placeholder="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Username">
      <button id="go" type="submit">Scan</button>
    </div>
    <label class="check"><input id="presence" type="checkbox" checked> Also check 600+ other sites</label>
    <label class="check"><input id="audit" type="checkbox"> Footprint audit (I'm scanning myself)</label>
    <details>
      <summary>More options</summary>
      <div class="opts">
        <label class="check"><input id="variants" type="checkbox"> Try username variations (ada_dev → adadev, ada.dev…)</label>
        <label class="check"><input id="strict" type="checkbox"> Hide username-only matches</label>
        <label class="check"><input id="nopivot" type="checkbox"> Don't follow links to other profiles</label>
        <label>Known accounts
          <textarea id="accounts" rows="3" placeholder="mastodon=someone@mastodon.social&#10;stackoverflow=1234567&#10;website=example.com"
                    autocapitalize="none" spellcheck="false"></textarea>
          <span class="hint">One per line as platform=handle. Platforms: <span id="platforms"></span></span>
        </label>
        <label>Email (public Gravatar profile)
          <input id="email" type="email" autocapitalize="none" spellcheck="false">
        </label>
        <label>GitHub token (optional)
          <input id="token" type="password" autocapitalize="none" spellcheck="false">
          <span class="hint">Raises GitHub's limit from 60 to 5,000 requests an hour. Kept only in this browser.</span>
        </label>
        <label>Relay URL
          <input id="relay" type="url" placeholder="https://profiler-relay.you.workers.dev" autocapitalize="none" spellcheck="false">
        </label>
        <label>Relay token
          <input id="relaytoken" type="password" autocapitalize="none" spellcheck="false">
          <span class="hint">Browsers can't read most sites directly. Your own relay (a free Cloudflare Worker, see
            the README) fetches them for you; it's needed for the 600+ site check and several sources.</span>
        </label>
      </div>
    </details>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="report"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
