<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Profiler">
<title>Profiler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#070b10;--panel:#0d141c;--line:#1d2c3a;--ink:#d7e3ee;--dim:#7d92a6;--accent:#36d6e7;
--ok:#4ade80;--warn:#f5b942;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:light){:root{--bg:#f3f6f9;--panel:#fff;--line:#d5dee7;--ink:#14212d;
--dim:#5b6f82;--accent:#04798a;--ok:#15803d;--warn:#a16207}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
main{max-width:980px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.brand{font:600 13px var(--mono);letter-spacing:.25em;color:var(--accent);margin:4px 0 14px}
form{background:var(--panel);border:1px solid var(--line);padding:14px;display:grid;gap:12px}
.row{display:flex;gap:8px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;min-width:0;font:16px var(--mono);
color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:0}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:600 14px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);
background:var(--accent);color:var(--bg);padding:12px 16px;cursor:pointer;min-height:48px}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5}
details summary{cursor:pointer;color:var(--dim);font:13px var(--mono);padding:4px 0;min-height:32px}
details[open] summary{margin-bottom:10px}
details .opts{display:grid;gap:12px}
label{display:grid;gap:4px;font:12px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
label.check{display:flex;gap:10px;align-items:center;text-transform:none;font:14px system-ui;color:var(--ink);letter-spacing:0;min-height:32px}
label.check input{width:20px;height:20px;accent-color:var(--accent)}
.hint{font:12px system-ui;color:var(--dim);text-transform:none;letter-spacing:0}
#status{font:13px var(--mono);color:var(--dim);margin:14px 0 0;min-height:20px}
#status.err{color:var(--warn)}
.hud{display:flex;gap:16px;align-items:center;border:1px solid var(--accent);padding:18px;margin-top:22px;
background:var(--panel);position:relative}
.hud::before{content:"PROFILE";position:absolute;top:-9px;left:14px;background:var(--bg);
padding:0 8px;font:11px var(--mono);letter-spacing:.2em;color:var(--accent)}
.hud img{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);flex:none}
.hud h1{margin:0;font:600 20px var(--mono);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere}
.hud p{margin:4px 0 0}.dim{color:var(--dim)}.mono{font-family:var(--mono);font-size:12px}
h2{font:600 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;margin:0}
dt{color:var(--dim);font:11px var(--mono);text-transform:uppercase;padding-top:4px}dd{margin:0;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.card h3{margin:0 0 2px;font:600 14px var(--mono);text-transform:uppercase;display:flex;
justify-content:space-between;gap:8px;align-items:center}
.card p{margin:6px 0 0;overflow-wrap:anywhere}.card ul{margin:8px 0 0;padding-left:18px}
.tag{font:11px var(--mono);padding:1px 7px;border:1px solid currentColor;white-space:nowrap}
.asserted{color:var(--accent)}.confirmed,.likely{color:var(--ok)}.possible{color:var(--warn)}.unverified{color:var(--dim)}
.chips span{display:inline-block;border:1px solid var(--line);background:var(--panel);
padding:2px 9px;margin:0 6px 6px 0;font:12px var(--mono)}
.bars{display:flex;align-items:flex-end;gap:2px;height:64px}
.bars div{flex:1;background:var(--accent);min-height:2px;opacity:.85}
.axis{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
footer{margin-top:32px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:420px){dl{grid-template-columns:80px 1fr}.hud img{width:56px;height:56px}}
</style>
</head>
<body>
<main>
  <div class="brand">◢ PROFILER</div>
  <form id="search" autocomplete="off">
    <div class="row">
      <input id="handle" type="text" name="handle" placeholder="username" autocapitalize="none"
             autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Username">
      <button id="go" type="submit">Scan</button>
    </div>
    <details>
      <summary>More options</summary>
      <div class="opts">
        <label>Known accounts
          <textarea id="accounts" rows="3" placeholder="mastodon=someone@mastodon.social&#10;github=someone"
                    autocapitalize="none" spellcheck="false"></textarea>
          <span class="hint">One per line as platform=handle. Platforms: <span id="platforms"></span></span>
        </label>
        <label>Email (public Gravatar profile)
          <input id="email" type="email" autocapitalize="none" spellcheck="false">
        </label>
        <label class="check"><input id="strict" type="checkbox"> Hide username-only matches</label>
        <label class="check"><input id="nopivot" type="checkbox"> Don't follow links to other profiles</label>
        <label>GitHub token (optional)
          <input id="token" type="password" autocapitalize="none" spellcheck="false">
          <span class="hint">Raises GitHub's limit from 60 to 5,000 requests an hour. Kept only in this
            browser and sent only to api.github.com.</span>
        </label>
      </div>
    </details>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="report"></div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
