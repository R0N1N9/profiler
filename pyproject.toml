[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profiler"
version = "0.1.0"
description = "Build a dossier from what a person publishes on their public accounts"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
profiler = "profiler.cli:main"

[tool.setuptools]
packages = ["profiler"]
